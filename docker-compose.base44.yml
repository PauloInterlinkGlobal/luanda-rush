services:
  web:
    image: oven/bun:1.2
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: sh -c "bun install && bun run dev -- --host 0.0.0.0 --port 3000"
    environment:
      # Vite >= 6.1 appends this to its allowedHosts list so the preview proxy works
      # Pass through bare — the platform sets it to the sandbox host wildcard
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  node_modules:
