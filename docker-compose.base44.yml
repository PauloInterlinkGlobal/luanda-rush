services:
  web:
    image: oven/bun:1.2
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nitro
      - /app/.output
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - HOST=0.0.0.0
    command: sh -c "bun install && bun run dev -- --host 0.0.0.0 --port 5173"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
